name: bridge-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.1'
          enable-cache: true
      - name: Sync the committed application lock
        run: uv sync --locked --all-extras --python '${{ matrix.python }}'
      - name: Ruff correctness checks
        run: uv run --locked --all-extras ruff check .
      - run: npm ci --ignore-scripts --prefix wechat_dot_bridge/codecs
      - name: Required unittest, upgrade, privacy and release checks
        run: |
          export WECHAT_BRIDGE_FFMPEG="$(uv run --locked --all-extras python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          uv run --locked --all-extras python scripts/check_release.py
