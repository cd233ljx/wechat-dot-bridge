[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-dot-bridge"
version = "0.1.0"
description = "Private WeChat MCP Events bridge for an existing dot"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.txt", "licenses/*.txt"]
dependencies = ["cryptography>=46.0.5,<47", "Pillow>=12.1.1,<13"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
setup = ["qrcode==8.2"]

[project.scripts]
wechat-dot-bridge = "wechat_dot_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["wechat_dot_bridge*"]
exclude = ["wechat_dot_bridge.codecs.node_modules*"]

[tool.setuptools.package-data]
wechat_dot_bridge = ["codecs/*.mjs", "codecs/*.ts", "codecs/*.json"]
